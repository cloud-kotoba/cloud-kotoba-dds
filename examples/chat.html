  <body>
    <main style="height:100dvh" class="chat-workspace">
      <aside aria-label="Conversations" class="chat-sidebar">
        <button id="new" type="button">New chat</button>
        <p>Component example</p>
      </aside>
      <section aria-label="Example conversation" class="go-shell">
        <div class="go-conversation">
          <div id="welcome" class="go-welcome">
            <h1>What would you like to make?</h1>
          </div>
          <div role="region" tabindex="0" data-ck-chat="messages" id="messages" aria-label="Messages"></div>
        </div>
        <form id="composer" class="go-composer">
          <label for="input">Message</label>
          <textarea class="dads-textarea" rows="2" data-ck-chat="prompt" id="input" required placeholder="Try a message"></textarea>
          <div class="go-compose-actions">
            <div class="go-model-row">
              <select class="dads-select" data-ck-chat="model" aria-label="Model">
                <option value="demo">Local demo</option>
              </select>
            </div>
            <button type="submit">Send</button>
          </div>
          <small>Local fixture. No network generation or billing.</small>
        </form>
      </section>
    </main>
  </body>
</html><script>(function(global){
'use strict';
function createMessage({container,input,role,userLabel,stages}){
 if(!container||!Array.isArray(stages))throw new TypeError('container and stages are required');
 const doc=container.ownerDocument;
 function node(tag,cls,text){const n=doc.createElement(tag);n.className=cls;if(text!==undefined)n.textContent=text;return n;}
 const user=node('article','go-message go-user');user.append(node('span','go-role',userLabel),node('div','go-text',input));
 const answer=node('article','go-message go-assistant');answer.append(node('span','go-role',role));
 const steps=node('ol','go-steps');for(const stage of stages){const item=node('li','',stage.label);item.dataset.stage=stage.id;steps.append(item);}
 const live=node('p','go-turn-status');live.setAttribute('role','status');
 const output=node('div','go-text');const actions=node('div','go-actions');answer.append(steps,live,output,actions);container.append(user,answer);
 return {answer,steps,live,output,actions};
}
global.cloudKotobaChat=Object.freeze({createMessage});
})(globalThis);

const form=document.querySelector('#composer'),input=document.querySelector('#input'),list=document.querySelector('#messages');
form.onsubmit=e=>{e.preventDefault();if(!input.value.trim())return;document.querySelector('#welcome').hidden=true;
const view=cloudKotobaChat.createMessage({container:list,input:input.value,role:'Demo',userLabel:'You',stages:[]});
view.output.textContent='Local reply: '+input.value;view.live.textContent='Complete';input.value='';};
document.querySelector('#new').onclick=()=>{list.replaceChildren();document.querySelector('#welcome').hidden=false;input.focus();};
</script>
